<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Running Without Stops — lockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&display=swap">
<style>
  :root { --ink: #0A0C0B; --neon: #A8FF35; --paper: #F2F4F1; }
  body { margin: 0; padding: 64px; background: var(--ink); color: var(--paper);
         font-family: 'Archivo', system-ui, sans-serif; display: flex;
         flex-direction: column; gap: 56px; }
  .row { display: flex; align-items: center; gap: 28px; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .name { font-weight: 700; letter-spacing: 0.16em; line-height: 1.24; }
  hr { border: 0; border-top: 1px solid #1C211B; margin: 0; }
  img { display: block; }
</style>
</head>
<body>
  <!-- Horizontal -->
  <div class="row">
    <img src="../svg/mark-neon.svg" alt="" height="104">
    <div class="name" style="font-size: 25px;">RUNNING<br>WITHOUT<br>STOPS</div>
  </div>
  <hr>
  <!-- Stacked -->
  <div class="stack" style="align-self: flex-start;">
    <img src="../svg/mark-neon.svg" alt="" height="96">
    <div class="name" style="font-size: 15px; letter-spacing: 0.24em;">RUNNING WITHOUT STOPS</div>
  </div>
  <hr>
  <!-- Compact -->
  <div class="row">
    <img src="../svg/mark-neon.svg" alt="" height="48">
    <span style="font-weight: 600; font-size: 20px;">runningwithoutstops.com</span>
  </div>
</body>
</html>
